name: Daily supplier price report
on:
  workflow_dispatch:
  schedule:
    - cron: '30 9 * * *'
      timezone: Europe/Kyiv
    - cron: '0 17 * * *'
      timezone: Europe/Kyiv

permissions:
  contents: write
  actions: read

concurrency:
  group: price-history-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      collected: ${{ steps.slot.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      # Ubuntu 24.04 dependencies include Liberation Sans used by PNG reports.
      - run: python -m playwright install --with-deps chromium
        continue-on-error: true
      - name: Identify original run date
        id: run
        uses: actions/github-script@v7
        with:
          script: |
            const {data} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: context.runId});
            core.setOutput('created_at', data.created_at);
      - name: Check Kyiv slot and prepare rollback copy
        id: slot
        env:
          RUN_CREATED_AT: ${{ steps.run.outputs.created_at }}
          RUN_SCHEDULE: ${{ github.event.schedule }}
        run: python collection_run.py prepare --work "$RUNNER_TEMP/spm-run"
      # Restore these CSVs only with writers stopped, after checking later runs.
      # A failed backup upload stops collection before any history is written.
      - name: Upload pre-collection rollback copy
        if: steps.slot.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: spm-backup-${{ steps.slot.outputs.date }}-${{ steps.slot.outputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/spm-run/backup/
          if-no-files-found: error
          retention-days: 30
      - name: Collect prices
        if: steps.slot.outputs.run == 'true'
        id: collect
        run: |
          code=0
          python price_monitor.py || code=$?
          if [[ "$code" == 3 ]]; then
            echo "all_failed=true" >> "$GITHUB_OUTPUT"
          else
            exit "$code"
          fi
      - name: Validate history boundaries and capture this collection
        if: steps.slot.outputs.run == 'true'
        run: python collection_run.py capture --work "$RUNNER_TEMP/spm-run"
      - name: Persist validated observations and diagnostics
        if: steps.slot.outputs.run == 'true'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git add -- data/collection_status.csv
          if [[ -f data/price_history.csv ]]; then git add -- data/price_history.csv; fi
          if git diff --cached --quiet; then
            echo "History already current"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "Record daily supplier prices"
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
      - name: Preserve immutable morning snapshot
        if: steps.slot.outputs.run == 'true' && steps.slot.outputs.mode == 'morning'
        uses: actions/upload-artifact@v4
        with:
          name: spm-morning-${{ steps.slot.outputs.date }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/spm-run/current/snapshot.json
          if-no-files-found: error
          retention-days: 7
      - name: Find latest same-day morning snapshot
        id: morning
        continue-on-error: true
        if: steps.slot.outputs.run == 'true' && steps.slot.outputs.mode == 'evening' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        env:
          REPORT_DATE: ${{ steps.slot.outputs.date }}
        with:
          script: |
            const prefix = `spm-morning-${process.env.REPORT_DATE}-`;
            // Morning snapshots are small; cap discovery to recent artifacts.
            const {data} = await github.rest.actions.listArtifactsForRepo({...context.repo, per_page: 100});
            const candidates = data.artifacts.filter(a => !a.expired && a.name.startsWith(prefix) && a.workflow_run?.head_branch === context.ref.replace('refs/heads/', ''));
            candidates.sort((a, b) => b.created_at.localeCompare(a.created_at));
            for (const artifact of candidates) {
              const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: artifact.workflow_run.id});
              if (run.path === '.github/workflows/price-report.yml' && run.event !== 'pull_request') {
                core.setOutput('name', artifact.name);
                core.setOutput('run_id', run.id);
                break;
              }
            }
      - name: Download morning baseline
        continue-on-error: true
        if: steps.morning.outputs.name != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.morning.outputs.name }}
          run-id: ${{ steps.morning.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/spm-run/morning
      - name: Upload report and history
        if: steps.slot.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: supplier-prices
          path: |
            output/Supplier_Prices.xlsx
            data/price_history.csv
            data/collection_status.csv
          if-no-files-found: warn
          retention-days: 30
      # PNGs are rendered in a temporary folder; failures fall back to text.
      - name: Send Telegram price notes with text fallback
        if: github.ref == 'refs/heads/main' && steps.slot.outputs.run == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SPM_CURRENT_SNAPSHOT: ${{ runner.temp }}/spm-run/current/snapshot.json
          SPM_MORNING_SNAPSHOT: ${{ runner.temp }}/spm-run/morning/snapshot.json
        run: python telegram_report.py
      - name: Flag collection without successful observations
        if: steps.collect.outputs.all_failed == 'true'
        run: |
          echo "::error::No verified prices. See data/collection_status.csv."
          exit 1

  publish-drive:
    needs: collect
    if: github.ref == 'refs/heads/main' && needs.collect.outputs.collected == 'true' && vars.DRIVE_FILE_ID != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: supplier-prices
          path: report
      - name: Authenticate to Google Drive
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive
          create_credentials_file: false
      - name: Update the existing Excel file
        env:
          DRIVE_FILE_ID: ${{ vars.DRIVE_FILE_ID }}
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          [[ "$DRIVE_FILE_ID" =~ ^[A-Za-z0-9_-]+$ ]]
          curl --fail-with-body --silent --show-error --retry 2 \
            --request PATCH --header "Authorization: Bearer $ACCESS_TOKEN" \
            --header 'Content-Type: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' \
            --data-binary @report/output/Supplier_Prices.xlsx \
            "https://www.googleapis.com/upload/drive/v3/files/$DRIVE_FILE_ID?uploadType=media&fields=id,md5Checksum" > response.json
          checksum=$(md5sum report/output/Supplier_Prices.xlsx | cut -d' ' -f1)
          jq -e --arg id "$DRIVE_FILE_ID" --arg md5 "$checksum" '.id == $id and .md5Checksum == $md5' response.json
