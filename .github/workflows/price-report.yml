name: Price report (manual validation)
on:
  push:
    branches: [validate/persistent-price-history]
    paths: ['.github/workflows/price-report.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: price-history-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python price_monitor.py
      - name: Verify repeated run and Excel against the committed history
        run: |
          git diff --exit-code HEAD -- data/price_history.csv
          python - <<'PY'
          import csv
          from openpyxl import load_workbook
          from price_monitor import FIELDS, HISTORY, OUTPUT, history_key
          with HISTORY.open(encoding="utf-8", newline="") as stream:
              rows = list(csv.DictReader(stream))
          assert len(rows) >= 3 and len({history_key(r) for r in rows}) == len(rows)
          wb = load_workbook(OUTPUT, read_only=True, data_only=True)
          actual = list(wb["History"].values)[1:]
          assert actual == [tuple(r[k] for k in FIELDS) for r in rows]
          current = {row[2]: row[4] for row in list(wb["Current"].values)[1:]}
          assert current == {"32550": 79.90, "32546": 89.90, "32485": 74.80}
          assert wb["Errors"].max_row == 1
          print(f"Verified {len(rows)} history rows and {len(current)} current prices")
          PY
      - name: Persist validated history
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git add -- data/price_history.csv
          if git diff --cached --quiet; then
            echo "History already current"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "Record daily supplier prices"
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
      - name: Upload report and history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supplier-prices
          path: |
            output/Supplier_Prices.xlsx
            data/price_history.csv
          if-no-files-found: warn
          retention-days: 30
