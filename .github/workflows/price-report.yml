name: Price report (manual validation)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python price_monitor.py
      - name: Upload report and history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supplier-prices
          path: |
            output/Supplier_Prices.xlsx
            data/price_history.csv
          if-no-files-found: warn
          retention-days: 30
