name: Price report (manual validation)
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: price-history-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python price_monitor.py
      - name: Persist validated history
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git add -- data/price_history.csv
          if git diff --cached --quiet; then
            echo "History already current"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "Record daily supplier prices"
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
      - name: Upload report and history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supplier-prices
          path: |
            output/Supplier_Prices.xlsx
            data/price_history.csv
          if-no-files-found: warn
          retention-days: 30
